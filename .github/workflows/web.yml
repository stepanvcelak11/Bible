# Sestaví webovou verzi (PWA) a nasadí ji na GitHub Pages (větev gh-pages).
# Adresa: https://stepanvcelak11.github.io/Bible/
#
# Repozitář je veřejný, proto web obsahuje jen Bibli kralickou (volné dílo).
name: Web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Databáze Bible (jen BKR – volné dílo)
        run: python3 tool/build_bible_db.py --fetch --only BKR

      - name: Studijní balíček, mapy (STEPBible, OpenBible, Natural Earth)
        run: python3 tool/build_study_db.py --fetch

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Testy
        run: flutter test

      - name: Sestavení webu
        run: tool/build_web.sh --base-href /Bible/

      - name: Nasazení na gh-pages
        run: |
          cd build/web
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

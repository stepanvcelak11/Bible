name: bible_reader
description: "Soukromá, minimalistická a plně offline čtečka Bible v češtině."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (Riverpod 3, bez generování kódu).
  flutter_riverpod: ^3.4.3

  # Lokální SQLite: Drift nad balíčkem sqlite3 (v3 si přibaluje vlastní
  # build SQLite s FTS5, takže fulltext funguje stejně na Androidu i iOS).
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  sqlite3: ^3.8.0

  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    # Vygenerováno skriptem tool/build_bible_db.py (viz README).
    - assets/db/
